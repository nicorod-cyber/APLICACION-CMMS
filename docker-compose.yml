services:
  backend:
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
    container_name: maintenance-cmms-backend
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      DataProvider__Provider: SqlServer
      DataProvider__SqlServerConnectionString: Server=mssql,1433;Database=${MSSQL_DB:?MSSQL_DB must be set};User Id=sa;Password=${MSSQL_SA_PASSWORD:?MSSQL_SA_PASSWORD must be set};Encrypt=False;TrustServerCertificate=True
      Database__SeedReferenceCatalogs: "true"
      Database__SeedDemoData: "false"
      Jwt__Issuer: MaintenanceCMMS
      Jwt__Audience: MaintenanceCMMS.Clients
      Jwt__Secret: ${CMMS_JWT_SECRET:?CMMS_JWT_SECRET must be set}
      Jwt__ExpirationMinutes: 60
      Auth__SeedAdmin__Username: ${CMMS_INITIAL_ADMIN_USERNAME:?CMMS_INITIAL_ADMIN_USERNAME must be set}
      Auth__SeedAdmin__Email: ${CMMS_INITIAL_ADMIN_EMAIL:?CMMS_INITIAL_ADMIN_EMAIL must be set}
      Auth__SeedAdmin__DisplayName: Administrador CMMS
      Auth__SeedAdmin__Password: ${CMMS_INITIAL_ADMIN_PASSWORD:?CMMS_INITIAL_ADMIN_PASSWORD must be set}
      SharePoint__Provider: LocalSimulation
      SharePoint__LocalPath: /app/data/sharepoint-simulated
      SharePoint__ManualRootUrl: ""
      SharePoint__SiteUrl: ""
      SharePoint__TenantId: ""
      SharePoint__ClientId: ""
      SharePoint__SiteId: ""
      SharePoint__DriveId: ""
      Mail__Provider: Mailhog
      Mail__From: cmms@example.local
      Mail__PlanningEmail: planificacion@example.local
      Mail__Host: mailhog
      Mail__Port: 1025
      Pdf__TemplatePath: /app/data/templates
      Imports__StoragePath: /app/data/imports
    volumes:
      - ./data/imports:/app/data/imports
      - ./data/templates:/app/data/templates
      - ./data/sharepoint-simulated:/app/data/sharepoint-simulated
    ports:
      - "5041:8080"
    depends_on:
      mssql:
        condition: service_healthy
      mailhog:
        condition: service_started

  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: maintenance-cmms-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?MSSQL_SA_PASSWORD must be set}
    volumes:
      - sqlserver-data:/var/opt/mssql
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\""]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: infra/docker/frontend.Dockerfile
    container_name: maintenance-cmms-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

  nginx:
    image: nginx:1.27-alpine
    container_name: maintenance-cmms-nginx
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - backend
      - frontend

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: maintenance-cmms-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  sqlserver-data: