services:
  backend:
    environment:
      ASPNETCORE_ENVIRONMENT: Pilot
      DataProvider__Provider: SqlServer
      DataProvider__SqlServerConnectionString: Server=mssql,1433;Database=cmms_pilot;User Id=sa;Password=${MSSQL_SA_PASSWORD:?MSSQL_SA_PASSWORD must be set};Encrypt=False;TrustServerCertificate=True
      CMMS_PILOT_SQLSERVER: Server=mssql,1433;Database=cmms_pilot;User Id=sa;Password=${MSSQL_SA_PASSWORD:?MSSQL_SA_PASSWORD must be set};Encrypt=False;TrustServerCertificate=True
      Database__SeedReferenceCatalogs: "false"
      Database__SeedDemoData: "false"
      JobsEnabled: "false"